[package]
name = "archon"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "5.0"
futures-util = "0.3"
image = "0.25"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
tempfile = "3.13"
tokio = { version = "1.40", features = ["full", "process"] }
toml = "0.8"
which = "6.0"

# Main Application
[[bin]]
name = "archon"
path = "src/main.rs"

# Standalone Tool Binaries
[[bin]]
name = "execute_command"
path = "src/tools/execute_command.rs"

[[bin]]
name = "context"
path = "src/tools/context.rs"

[[bin]]
name = "edit_file"
path = "src/tools/edit_file.rs"
