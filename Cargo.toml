[package]
name = "archon"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.7", features = ["wayland-data-control"] }
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
dunce = "1.0"
figment = { version = "0.10", features = ["toml", "env"] }
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
image = "0.25"
pathdiff = "0.2"
ratatui = "0.30.2"
ratatui-textarea = "0.9.4"
regex = "1.11"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
schemars = "1.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
shlex = "2.0.1"
similar = "3.2.1"
tempfile = "3.27"
textwrap = "0.16"
tokio = { version = "1.54", features = ["full", "process"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
toml = "1.2.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wl-clipboard-rs = "0.9"

[[bin]]
name = "archon"
path = "src/main.rs"
