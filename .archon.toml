[app]
default_skills = ["codebase-architect"]
enabled_tools = [
    "cargo",
    "create_file",
    "delegate_task",
    "edit_file",
    "fetch_url",
    "fs",
    "git",
    "read_file",
    "repo_map",
    "search",
    "skill",
    "web_search",
    "workspace_snapshot",
]

[workspace_snapshot]
git_root = true
include = ["**/*"]
exclude = ["target/**", "Cargo.lock", "TODO.txt"]
include_in_tree = ["Cargo.lock"]
file = ["~/.config/archon/config.toml"]
max_size = 1048576
max_files = 10000
