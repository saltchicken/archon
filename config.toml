[app]
default_model = "qwen3.8:27b"
default_context = 32768
history_dir = "~/.local/share/archon/sessions"
required_commands = ["wl-paste"]
allowed_commands = ["ls", "cat", "echo", "pwd", "grep", "head", "tail", "wc"]

[ollama]
base_url = "http://localhost:11434"
chat_timeout = 180
status_timeout = 2

[[presets]]
name = "Custom"
prompt = ""

[[presets]]
name = "Describe this image in detail."
prompt = "Describe this image in detail."

[[presets]]
name = "Extract all the text from this image."
prompt = "Extract all the text from this image."

[[system_presets]]
name = "None"
prompt = ""

[[system_presets]]
name = "Helpful Assistant"
prompt = "You are a highly capable and helpful AI visual assistant. Provide concise and accurate answers."

[[system_presets]]
name = "JSON Only"
prompt = "You are a data extractor. Only output valid JSON. Do not include any other text, markdown formatting, or explanations."
